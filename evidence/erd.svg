<svg xmlns="http://www.w3.org/2000/svg" width="900" height="660" viewBox="0 0 900 660"><title>Meridian workflow ERD</title><rect width="900" height="660" fill="#eef0f7"/><style>text{font-family:Segoe UI,Arial,sans-serif;fill:#211e37}.title{font-size:27px;font-weight:700}.head{font-size:15px;font-weight:700;fill:white}.row{font-size:14px}.edge{fill:none;stroke:#7669ad;stroke-width:2}.mark{font-size:13px;font-weight:700}</style><text x="35" y="50" class="title">Meridian Workflow · Entity relationship diagram</text>
<path class="edge" d="M270 120H305 M540 120H610 M380 199V275 M445 199V275 M270 323H305 M540 320H610 M540 356H580V435H610 M422 400V480 M540 150H570V280H610 M540 176H555V465H610 M155 376 V577 H775 V519"/>
<g transform="translate(35 95)"><rect width="235" height="69" rx="7" fill="#fff" stroke="#b9b1d8"/><path d="M0 7Q0 0 7 0H228Q235 0 235 7V31H0Z" fill="#393064"/><text x="12" y="21" class="head">ROLES</text><text x="12" y="47" class="row">PK id · label</text></g><g transform="translate(305 95)"><rect width="235" height="107" rx="7" fill="#fff" stroke="#b9b1d8"/><path d="M0 7Q0 0 7 0H228Q235 0 235 7V31H0Z" fill="#393064"/><text x="12" y="21" class="head">USERS</text><text x="12" y="47" class="row">PK id · FK role → roles.id</text><text x="12" y="66" class="row">name · email (unique)</text><text x="12" y="85" class="row">password_hash</text></g><g transform="translate(610 95)"><rect width="235" height="88" rx="7" fill="#fff" stroke="#b9b1d8"/><path d="M0 7Q0 0 7 0H228Q235 0 235 7V31H0Z" fill="#393064"/><text x="12" y="21" class="head">SESSIONS</text><text x="12" y="47" class="row">PK token_hash · FK user_id</text><text x="12" y="66" class="row">csrf · expires_at</text></g><g transform="translate(35 300)"><rect width="235" height="88" rx="7" fill="#fff" stroke="#b9b1d8"/><path d="M0 7Q0 0 7 0H228Q235 0 235 7V31H0Z" fill="#393064"/><text x="12" y="21" class="head">STAGES</text><text x="12" y="47" class="row">PK id · label</text><text x="12" y="66" class="row">position (unique)</text></g><g transform="translate(305 275)"><rect width="235" height="126" rx="7" fill="#fff" stroke="#b9b1d8"/><path d="M0 7Q0 0 7 0H228Q235 0 235 7V31H0Z" fill="#393064"/><text x="12" y="21" class="head">TASKS</text><text x="12" y="47" class="row">PK id · FK creator · FK assignee</text><text x="12" y="66" class="row">FK stage · title · description</text><text x="12" y="85" class="row">due_date · priority</text><text x="12" y="104" class="row">version · deleted</text></g><g transform="translate(610 255)"><rect width="235" height="88" rx="7" fill="#fff" stroke="#b9b1d8"/><path d="M0 7Q0 0 7 0H228Q235 0 235 7V31H0Z" fill="#393064"/><text x="12" y="21" class="head">COMMENTS</text><text x="12" y="47" class="row">PK id · FK task_id · FK author_id</text><text x="12" y="66" class="row">body · created_at</text></g><g transform="translate(610 415)"><rect width="235" height="107" rx="7" fill="#fff" stroke="#b9b1d8"/><path d="M0 7Q0 0 7 0H228Q235 0 235 7V31H0Z" fill="#393064"/><text x="12" y="21" class="head">ACTIVITY</text><text x="12" y="47" class="row">PK id · FK task_id · FK actor_id</text><text x="12" y="66" class="row">FK from_stage · FK to_stage</text><text x="12" y="85" class="row">action · created_at</text></g><g transform="translate(305 480)"><rect width="235" height="88" rx="7" fill="#fff" stroke="#b9b1d8"/><path d="M0 7Q0 0 7 0H228Q235 0 235 7V31H0Z" fill="#393064"/><text x="12" y="21" class="head">SUBTASKS</text><text x="12" y="47" class="row">PK (task_id, position)</text><text x="12" y="66" class="row">FK task_id · title</text></g>
<text x="35" y="599" class="row">All connectors are one-to-many. Sessions can be anonymous. Activity stage references are optional.</text><text x="35" y="624" class="row">Creator, assignee, author and actor reference users.id. Stage references point to stages.id.</text></svg>